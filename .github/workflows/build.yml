name: Build

# Titan fork, 2.11 line (what prod-smp runs): builds and tests only what ships (the Velocity jar).
# Upstream's publish, preview and dispatch workflows target GeyserMC infrastructure and are removed.
#
# A tag `geyser-velocity-<version>` also publishes the jar to R2 as
# releases/geyser-velocity-<version>.jar, which the Tessera operator registers on its own when a
# pack pins that version. No hand upload to the cluster MinIO.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    tags:
      - 'geyser-velocity-*'
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # languages/ and mappings/ must be in the jar, or Geyser fails to start
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        # Indra turns strict versions on when CI is set, which compiles with a JDK 21 javac that
        # cannot read Carbon's Java 25 classes. Off, javac 25 compiles with --release 21, as locally.
        run: ./gradlew -PstrictMultireleaseVersions=false :core:test :ddui:test :velocity:build
        env:
          # carbon-bedrock-ui and proxybridge api come from GitHub Packages
          GITHUB_ACTOR: ${{ github.actor }}
          TITAN_PKG_READ_TOKEN: ${{ secrets.TITAN_PKG_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check bundled resources
        run: |
          jar=bootstrap/velocity/build/libs/Geyser-Velocity.jar
          for entry in languages/texts/en_US.properties mappings/blocks.nbt GeyserIntegratedPack.mcpack titan/fallback_block_tags.json; do
            unzip -l "$jar" "$entry" > /dev/null || { echo "missing $entry in $jar"; exit 1; }
          done

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: Geyser-Velocity
          path: bootstrap/velocity/build/libs/Geyser-Velocity.jar
          if-no-files-found: error

      - name: Publish to R2
        if: startsWith(github.ref, 'refs/tags/geyser-velocity-')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          key="releases/${GITHUB_REF_NAME}.jar"
          # A published version is never replaced: the operator caches it by sha256.
          if aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket tessera-plugins --key "$key" > /dev/null 2>&1; then
            echo "::error::$key already exists"; exit 1
          fi
          jar=bootstrap/velocity/build/libs/Geyser-Velocity.jar
          aws s3 cp "$jar" "s3://tessera-plugins/$key" --endpoint-url "$R2_ENDPOINT"
          echo "Published $key, sha256 $(sha256sum "$jar" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
